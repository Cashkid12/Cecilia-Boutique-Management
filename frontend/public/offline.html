<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D6C2A1">
  <title>Offline - Cecilia Boutique</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #F5EFE6 0%, #FFFFFF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .offline-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: #F5EFE6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon {
      font-size: 48px;
    }

    h1 {
      color: #2E2E2E;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #6B7280;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .info-box {
      background: #F5EFE6;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: left;
    }

    .info-box h3 {
      color: #2E2E2E;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .info-box ul {
      list-style: none;
      padding: 0;
    }

    .info-box li {
      color: #4B5563;
      font-size: 14px;
      padding: 6px 0;
      padding-left: 24px;
      position: relative;
    }

    .info-box li:before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #10B981;
      font-weight: bold;
    }

    .info-box li.warning:before {
      content: '⚠';
      color: #F59E0B;
    }

    .retry-button {
      background: #D6C2A1;
      color: #2E2E2E;
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .retry-button:hover {
      background: #B89B72;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(214, 194, 161, 0.4);
    }

    .retry-button:active {
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .offline-card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <div class="icon">📡</div>
    </div>

    <h1>You're Offline</h1>
    <p class="subtitle">No internet connection detected</p>

    <div class="info-box">
      <h3>You can still:</h3>
      <ul>
        <li>View cached inventory</li>
        <li>See recent sales</li>
        <li>Access previously loaded pages</li>
      </ul>
    </div>

    <div class="info-box">
      <h3>Requires internet:</h3>
      <ul>
        <li class="warning">Recording new sales (will sync later)</li>
        <li class="warning">Adding new stock</li>
        <li class="warning">Viewing reports</li>
      </ul>
    </div>

    <button class="retry-button" onclick="window.location.reload()">
      🔄 Try Again
    </button>
  </div>

  <script>
    // Check connection status
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
